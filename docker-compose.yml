services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/helpdesk
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-before-deploying}
      CLIENT_URL: http://localhost:8080
      ADMIN_SIGNUP_CODE: ${ADMIN_SIGNUP_CODE:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "8080:80"

volumes:
  mongo-data:
